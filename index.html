<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Sloka drill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: una colonna da telefono; il dipinto in alto sfuma nel fondo, sotto pannelli di vetro stondati; barra delle sezioni fissa. */
:root{
  --ground:#F3E2BE; --halo1:rgba(240,150,60,.38); --halo2:rgba(226,186,110,.6);
  --ink:#1F2A5C; --soft:#3D466F; --accent:#A04F10; --on-accent:#FFFFFF;
  --glass:rgba(255,255,255,.46); --glass-b:rgba(255,255,255,.78); --row:rgba(255,255,255,.44); --pill:rgba(255,255,255,.6);
  --hi:rgba(255,255,255,.7); --sel-bg:rgba(160,79,16,.17); --sel-ink:#75380A; --sel-b:rgba(160,79,16,.5); --navglass:rgba(255,248,235,.5);
  --g1:rgba(255,255,255,.72); --g2:rgba(255,255,255,.1); --g3:rgba(255,255,255,.36); --edge:rgba(255,255,255,.9); --drop:rgba(120,66,14,.26);
  --c1:rgba(255,255,255,.64); --c2:rgba(255,255,255,.26); --sel-a:rgba(214,128,48,.34); --sel-glow:rgba(190,100,20,.45); --halo3:rgba(232,120,90,.3); --gold-a:rgba(247,206,98,.92); --gold-b:rgba(224,162,40,.78); --gold-e:#D8A535; --gold-ink:#5A3404; --gold-glow:rgba(214,150,30,.55); --dr1:rgba(255,255,255,.5); --dr2:rgba(255,255,255,.16); --ti-glow:rgba(255,241,202,.96); --ti-a:#6A3303; --ti-b:#AD6A0C; --ti-sh:rgba(255,246,220,.9); --veil-top:rgba(243,226,190,.05); --veil-mid:rgba(243,226,190,.8);
  --c1s:rgba(255,251,243,.78); --c2s:rgba(255,246,231,.54); --rows:rgba(255,255,255,.56); --cap:rgba(255,248,236,.86); --g2s:rgba(255,250,240,.56); --g3s:rgba(255,245,228,.7); --sels:rgba(240,200,146,.78); --selas:rgba(234,176,104,.82);
  --hair:rgba(31,42,92,.18); --blank:rgba(160,79,16,.16); --veil:rgba(31,42,92,.14);
  --shadow:0 18px 40px rgba(140,90,30,.16); --fade-top:rgba(243,226,190,0);
  --mark:#C98A12; --mark-soft:#FBE7B4;
  --ok:#17693F; --ok-soft:#DDF1E3; --bad:#A8281F; --bad-soft:#F9DEDA;
  --f-dev:"Noto Serif Devanagari","FreeSerif","Noto Sans Devanagari",serif;
  --f-serif:"Noto Serif","Georgia","Liberation Serif",serif;
  --f-ui:"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1230; --halo1:rgba(74,58,110,.55); --halo2:rgba(40,46,110,.6);
    --ink:#F3EEE2; --soft:#C9C6E0; --accent:#E9B65A; --on-accent:#1A1530;
    --glass:rgba(28,33,84,.6); --glass-b:rgba(255,255,255,.18); --row:rgba(255,255,255,.09); --pill:rgba(14,18,48,.55);
    --hi:rgba(255,255,255,.14); --sel-bg:rgba(233,182,90,.2); --sel-ink:#F3CC80; --sel-b:rgba(233,182,90,.6); --navglass:rgba(30,35,92,.5);
    --g1:rgba(255,255,255,.24); --g2:rgba(255,255,255,.03); --g3:rgba(255,255,255,.11); --edge:rgba(255,255,255,.3); --drop:rgba(0,0,0,.5);
    --c1:rgba(74,80,160,.46); --c2:rgba(20,24,66,.56); --sel-a:rgba(240,196,110,.36); --sel-glow:rgba(233,182,90,.4); --halo3:rgba(120,70,150,.4); --gold-a:rgba(246,208,120,.95); --gold-b:rgba(218,164,62,.85); --gold-e:#F3CC80; --gold-ink:#2A1A04; --gold-glow:rgba(233,182,90,.5); --dr1:rgba(70,78,160,.46); --dr2:rgba(22,26,70,.36); --ti-glow:rgba(233,182,90,.3); --ti-a:#F8DFA0; --ti-b:#E2A93E; --ti-sh:rgba(10,12,36,.9); --veil-top:rgba(14,18,48,.3); --veil-mid:rgba(14,18,48,.84);
    --c1s:rgba(40,46,108,.78); --c2s:rgba(18,22,62,.72); --rows:rgba(255,255,255,.11); --cap:rgba(18,22,62,.84); --g2s:rgba(40,46,108,.58); --g3s:rgba(24,28,76,.72); --sels:rgba(96,76,40,.8); --selas:rgba(128,98,46,.84);
    --hair:rgba(255,255,255,.16); --blank:rgba(233,182,90,.22); --veil:rgba(255,255,255,.22);
    --shadow:0 18px 40px rgba(0,0,0,.35); --fade-top:rgba(14,18,48,.38);
    --mark:#E9B94A; --mark-soft:#3E3317;
    --ok:#5CC796; --ok-soft:#17372A; --bad:#F08B84; --bad-soft:#3E1D1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1230; --halo1:rgba(74,58,110,.55); --halo2:rgba(40,46,110,.6);
  --ink:#F3EEE2; --soft:#C9C6E0; --accent:#E9B65A; --on-accent:#1A1530;
  --glass:rgba(28,33,84,.6); --glass-b:rgba(255,255,255,.18); --row:rgba(255,255,255,.09); --pill:rgba(14,18,48,.55);
    --hi:rgba(255,255,255,.14); --sel-bg:rgba(233,182,90,.2); --sel-ink:#F3CC80; --sel-b:rgba(233,182,90,.6); --navglass:rgba(30,35,92,.5);
    --g1:rgba(255,255,255,.24); --g2:rgba(255,255,255,.03); --g3:rgba(255,255,255,.11); --edge:rgba(255,255,255,.3); --drop:rgba(0,0,0,.5);
    --c1:rgba(74,80,160,.46); --c2:rgba(20,24,66,.56); --sel-a:rgba(240,196,110,.36); --sel-glow:rgba(233,182,90,.4); --halo3:rgba(120,70,150,.4); --gold-a:rgba(246,208,120,.95); --gold-b:rgba(218,164,62,.85); --gold-e:#F3CC80; --gold-ink:#2A1A04; --gold-glow:rgba(233,182,90,.5); --dr1:rgba(70,78,160,.46); --dr2:rgba(22,26,70,.36); --ti-glow:rgba(233,182,90,.3); --ti-a:#F8DFA0; --ti-b:#E2A93E; --ti-sh:rgba(10,12,36,.9); --veil-top:rgba(14,18,48,.3); --veil-mid:rgba(14,18,48,.84);
    --c1s:rgba(40,46,108,.78); --c2s:rgba(18,22,62,.72); --rows:rgba(255,255,255,.11); --cap:rgba(18,22,62,.84); --g2s:rgba(40,46,108,.58); --g3s:rgba(24,28,76,.72); --sels:rgba(96,76,40,.8); --selas:rgba(128,98,46,.84);
  --hair:rgba(255,255,255,.16); --blank:rgba(233,182,90,.22); --veil:rgba(255,255,255,.22);
  --shadow:0 18px 40px rgba(0,0,0,.35); --fade-top:rgba(14,18,48,.38);
  --mark:#E9B94A; --mark-soft:#3E3317;
  --ok:#5CC796; --ok-soft:#17372A; --bad:#F08B84; --bad-soft:#3E1D1B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);background-image:radial-gradient(70% 30% at 92% 34%,var(--halo1),transparent),radial-gradient(80% 34% at 4% 62%,var(--halo2),transparent),radial-gradient(70% 28% at 80% 92%,var(--halo3),transparent);background-attachment:fixed;color:var(--ink);font:16px/1.55 var(--f-ui);padding-inline:16px;padding-block:0 84px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin-inline:auto}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* testata con il dipinto */
.hero{position:relative;height:132px;margin-inline:-16px;overflow:hidden}
.hero.noimg{height:72px}
.hero img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 40%}
.hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,var(--fade-top) 0%,var(--fade-top) 50%,var(--ground) 100%)}
.topbar{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{padding:8px 14px;border-radius:18px;background:var(--pill);font:600 12px var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.chip{min-height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--pill);font:600 13.5px var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
header{padding-block:2px 10px;display:flex;flex-direction:column;gap:4px}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.star{flex:0 0 auto;width:48px;height:48px;border:0;border-radius:24px;background:var(--pill);display:grid;place-items:center;cursor:pointer;color:var(--accent)}
.star svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star[aria-pressed="true"] svg{fill:currentColor}
h1{font:600 clamp(20px,6vw,26px)/1.2 var(--f-serif);margin:0;color:var(--accent);text-wrap:balance}
.sub{color:var(--soft);margin:0;font-size:14.5px}
.prefs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.prefs::-webkit-scrollbar{display:none}
.prefs .chip{flex:0 0 auto;font-size:13px}
.prefs .chip{background:var(--row);padding:0 12px}
.prefs .chip[aria-pressed="true"]{background:var(--accent)}

nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);width:min(528px,calc(100% - 32px));bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:4px;border-radius:30px;background:var(--navglass);border:1px solid var(--glass-b);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:0 16px;border:0;background:var(--row);color:var(--ink);border-radius:22px;font:500 15px var(--f-ui);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
#tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
#tabs .tab{padding:0 6px}
#tabs .tab{font-size:16px}
#subnav{padding-top:10px}
.tabs.sub{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);overflow:visible}
.tabs.sub .tab{padding:0 4px;font-size:14px}
.tabs.sub .tab{background:none;border:1.5px solid var(--hair)}
.tabs.sub .tab[aria-selected="true"]{background:var(--row);border-color:var(--accent);color:var(--ink)}
.seg.scope{display:grid;grid-template-columns:1.6fr repeat(4,minmax(0,1fr))}
.seg.scope button{padding:0 4px}
.ctl{display:flex;flex-direction:column;gap:10px}
.tile{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;color:var(--ink);padding:18px}
.tile-t{display:block;font:600 19px/1.3 var(--f-serif);color:var(--accent)}
.tile-d{display:block;font-size:14.5px;color:var(--soft);margin-top:2px}
.seg.diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.diff button{padding:0 4px;font-size:13.5px;white-space:nowrap}
.dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.btn.primary[aria-pressed="true"]{outline:0}

section.panel{padding-block:10px 14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:26px;padding:18px 16px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.hint{color:var(--soft);font-size:14.5px;margin:0}
h2{font:600 19px/1.25 var(--f-serif);margin:0 0 6px;color:var(--accent)}
.eyebrow{font:600 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 6px}

/* righe di pāda */
.pada{display:grid;grid-template-columns:1.2rem minmax(0,1fr);gap:8px;align-items:baseline;padding-block:5px}
.pada.nonum{display:block;text-align:center}
.pn{font:600 12.5px var(--f-ui);color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.dev{font-family:var(--f-dev);font-weight:600;color:var(--accent);font-size:clamp(19px,5.2vw,24px);line-height:1.8;overflow-wrap:anywhere}
.iast{font:400 clamp(18px,4.9vw,22px)/1.75 var(--f-serif);font-style:italic;overflow-wrap:anywhere}
.gloss{font-size:13px;line-height:1.45;color:var(--soft);margin-top:2px}
.w{background:none;border:0;border-bottom:1px solid var(--mark);padding:0 2px;font:inherit;font-style:inherit;cursor:pointer;color:inherit;border-radius:6px}
.w[aria-pressed="true"]{background:var(--sel-bg);border-bottom-color:var(--accent)}
.wcard{padding:12px 0;border-top:1px solid var(--hair)}
.wcard:first-child{border-top:0;padding-top:0}
.wk{font:italic 600 20px var(--f-serif);color:var(--accent)}
.wm{font-weight:600;margin-top:2px}
.wi{color:var(--soft);font-size:15px;margin-top:2px}
.wp{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.wp li{padding:8px 12px;border-radius:14px;background:var(--row)}
details{border-top:1px solid var(--hair);padding-block:10px}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer;min-height:28px}
details p{margin:8px 0 0;font:400 16px/1.6 var(--f-serif)}
.src{font:400 13.5px/1.5 var(--f-ui);color:var(--soft)}
ul.src{padding-left:18px;margin:8px 0 0}
.src li{margin-bottom:3px;overflow-wrap:anywhere}

/* controlli */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{min-height:46px;padding:0 16px;border-radius:16px;border:0;background:var(--row);font:500 15px var(--f-ui);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font:600 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 6px;display:block}
.blank{font:inherit;display:inline-block;min-width:2ch;height:1.4em;vertical-align:middle;border:0;border-bottom:2px dashed var(--accent);background:var(--blank);border-radius:8px;cursor:pointer;margin-inline:1px}
.sep{white-space:pre}

/* campi di scrittura */
input.fld{font:400 20px var(--f-serif);font-style:italic;color:var(--ink);background:var(--row);border:0;border-bottom:2px solid var(--accent);border-radius:12px 12px 0 0;padding:6px 10px;min-height:44px;max-width:100%}
input.fld.wide{width:100%}
input.fld.ok{border-color:var(--ok);background:var(--ok-soft)}
input.fld.bad{border-color:var(--bad);background:var(--bad-soft)}
.cloze{font:400 clamp(18px,4.9vw,22px)/2.6 var(--f-serif);font-style:italic}
.cloze input.fld{font-size:inherit;padding:2px 8px;min-height:40px}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.key{min-height:44px;border:0;border-radius:12px;background:var(--row);font:400 20px var(--f-serif);cursor:pointer}
.key:active{background:var(--blank)}
.fbrow{border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--row)}
.fbrow.ok{background:var(--ok-soft)}
.fbrow.bad{background:var(--bad-soft)}
.diff{font:400 21px/1.6 var(--f-serif);font-style:italic;overflow-wrap:anywhere}
.ch.dia{background:var(--mark-soft);border-bottom:2px solid var(--mark)}
.ch.dia sup,.ch.let sup{font:600 13px var(--f-serif);font-style:normal;margin-left:1px}
.ch.let{border-bottom:2px solid var(--bad);color:var(--bad)}
.ch.miss{border-bottom:2px dashed var(--bad);color:var(--bad)}
.ch.extra{text-decoration:line-through;color:var(--bad)}
.fbs{font-size:14.5px;color:var(--soft);margin-top:2px}
.legend{font-size:13px;color:var(--soft);margin:10px 0 0}
.good{font-weight:600;color:var(--ok)}

/* sandhi */
.verse-s{font:400 clamp(18px,4.9vw,22px)/1.85 var(--f-serif);font-style:italic;white-space:pre-wrap}
.sg{border:0;border-bottom:1px solid var(--mark);padding:0 2px 1px;margin:0 -1px;font:inherit;font-style:inherit;cursor:pointer;color:inherit;border-radius:9px;white-space:pre-wrap;text-align:left;
  background:linear-gradient(180deg,var(--g3),var(--g2));box-shadow:inset 0 1px 0 var(--hi)}
.sg:active{background:var(--sel-bg)}
.sg sup{font:600 .58em var(--f-ui);font-style:normal;margin-left:1px;color:var(--accent)}
.sandhi-card{margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);border-radius:4px}
.sandhi-card:first-child{margin-top:0;padding-top:0;border-top:0}
.sandhi-card.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{outline:4px solid var(--mark)}to{outline:4px solid transparent}}
.sh{display:flex;gap:10px;align-items:center;width:100%;min-height:44px;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.sh .eq{flex:1 1 auto;min-width:0}
.sh .chev{flex:0 0 auto;transition:transform .15s}
.sh[aria-expanded="true"] .chev{transform:rotate(180deg)}
.btn.sm{min-height:44px;padding:0 10px;font-size:14px;border-radius:14px}
.btn.sm[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);outline:0}
.nb{flex:0 0 auto;display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--on-accent);font:600 14px var(--f-ui)}
.eq{font:italic 600 18px/1.4 var(--f-serif);overflow-wrap:anywhere}
.sut{margin-top:10px;padding-top:10px;border-top:1px solid var(--hair)}
.sut-n{font:600 12.5px var(--f-ui);color:var(--accent);letter-spacing:.06em}
.sut-t{font:italic 400 17px/1.5 var(--f-serif);margin:2px 0;overflow-wrap:anywhere}
.sut-x{font-size:14.5px;color:var(--soft)}
.cover .sut-body{filter:blur(7px);cursor:pointer;user-select:none}
.cover .sut-body.rev{filter:none;user-select:auto}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.choices button{min-height:46px;padding:8px 14px;text-align:left;display:flex;gap:10px;align-items:baseline;border-radius:16px;border:2px solid transparent;background:var(--row);font:600 15px var(--f-ui);cursor:pointer}
.choices button[aria-pressed="true"]{border-color:var(--accent)}
.choices button.ok{background:var(--ok-soft);border-color:var(--ok)}
.choices button.bad{background:var(--bad-soft);border-color:var(--bad)}
.choices .cn{flex:0 0 auto;min-width:2ch;font-variant-numeric:tabular-nums;color:var(--accent)}
.choices .ct{font:italic 400 16px/1.4 var(--f-serif);overflow-wrap:anywhere;min-width:0}
.trad{font:400 15.5px/1.62 var(--f-serif);margin:0;padding:2px 6px 4px;text-wrap:pretty}
.vcard{padding:18px 14px}
.rule{height:1px;background:var(--hair);margin:14px 6px}
.fitbox{text-align:center}
.fitline{white-space:nowrap;line-height:1.6}
.vcard .iast{font-weight:500}
/* il verso in tondo invece che in corsivo */
.roman .iast{font-style:normal;font-weight:500;letter-spacing:.005em}
.star{width:44px;height:44px}

/* schede */
.flash-card{min-height:230px;width:100%;text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:8px;color:var(--ink)}
.flash-card .big{font:italic 600 29px/1.3 var(--f-serif);color:var(--accent);overflow-wrap:anywhere}
.flash-card .wp{text-align:left}
.count{font:600 13px var(--f-ui);color:var(--soft);font-variant-numeric:tabular-nums;margin:0}
.rp{display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center;padding-block:26px}
.rp .first{font:italic 400 30px/1.3 var(--f-serif);color:var(--accent);overflow-wrap:anywhere}

 context:[
  {v:true,t:'Il verso è ŚB 11.9.29, nell’Undicesimo Canto. Nel capitolo 7 («Lord Kṛṣṇa Instructs Uddhava») Kṛṣṇa consiglia a Uddhava la rinuncia, perché il Signore sta per lasciare la terra prima che la corruzione del Kali-yuga si diffonda. Uddhava chiede una guida pratica e Kṛṣṇa gli racconta una storia antica: il dialogo fra il potente re Yadu e un avadhūta (11.7.24).'},
  {v:true,t:'Yadu vede un brāhmaṇa avadhūta, giovane e colto, che gira senza alcun timore (11.7.25), e lo interroga. Il brāhmaṇa risponde dicendo di aver preso rifugio in ventiquattro guru: terra, aria, cielo, acqua, fuoco, luna, sole, piccione, pitone, mare, falena, ape, elefante, ladro di miele, cervo, pesce, la prostituta Piṅgalā, l’uccello kurara, il bambino, la fanciulla, il fabbricante di frecce, il serpente, il ragno e la vespa (11.7.33-35). Il capitolo 8 si intitola «The Story of Piṅgalā» (Vedabase); non ne ho letto i singoli versi. Chi parla è sempre il brāhmaṇa: il capitolo 9 si apre con «śrī-brāhmaṇa uvāca» (11.9.1).'},
  {v:true,t:'Il capitolo 9 («Detachment from All that Is Material») riprende dai maestri rimasti. Il suo filo, secondo il riassunto di Vedabase, è che l’attaccamento porta sofferenza e il distacco felicità illimitata, con la solitudine, la mente fissa sul Signore e il giusto uso della rara forma umana. Il kurara: dei rapaci assalgono un rapace più debole che tiene un pezzo di carne, e quando lui lo lascia per salvarsi la vita prova vera felicità (9.2). Il bambino vive libero dalle ansie (9.3-4). La fanciulla con i braccialetti di conchiglia ne toglie finché ne resta uno per polso, per eliminare rumore e litigi (9.5-10). Il fabbricante di frecce è così assorbito da non accorgersi del re che passa (9.13). Il serpente non costruisce case e vive in quelle degli altri (9.15). Il ragno è l’immagine del Signore che crea e ritira l’universo come il ragno il proprio filo (9.16-21). La vespa e l’insetto che, pensando a lei per paura, ne raggiunge la condizione mostrano che si diventa ciò su cui si fissa la mente (9.22-23).'},
  {v:true,t:'Poi il brāhmaṇa annuncia che imparerà anche dal proprio corpo (9.24). Il corpo è un maestro perché insegna il distacco: è soggetto a nascita e distruzione, finisce sempre in dolore, e lui lo usa per conoscere ricordando che sarà consumato da altri (9.25). L’uomo attaccato al corpo accumula denaro con grande fatica per moglie, figli, case, animali, servitori e amici, tutto per il piacere del proprio corpo; e come un albero prima di morire produce il seme del successivo, il corpo che muore lascia il seme del prossimo nel karma accumulato, assicurando la continuità dell’esistenza materiale (9.26). I sensi tormentano l’anima condizionata come più mogli che tirano un uomo ciascuna verso il proprio interesse: la lingua vuole cibo, la sete bevande, e poi gli organi sessuali, il tatto, il ventre, le orecchie, l’olfatto e gli occhi chiedono ciascuno la sua soddisfazione (9.27).'},
  {v:true,t:'Qui arriva la svolta (9.28): il Signore aveva creato innumerevoli specie, alberi, rettili, animali, uccelli e serpenti, ma non era soddisfatto nel cuore; allora creò la vita umana, che dà un’intelligenza sufficiente a percepire la Verità Assoluta, e se ne compiacque. Il nostro verso (9.29) viene subito dopo. Subito dopo di esso (9.30) il brāhmaṇa conclude: così, nato in lui il distacco e illuminato dalla conoscenza realizzata, vaga per la terra libero da attaccamento e falso ego.'},
  {v:false,t:'Il filo del discorso, nella mia lettura: il corpo e i sensi trascinano l’anima in mille direzioni (9.27), eppure il Signore ha dato la forma umana proprio perché si possa vedere la Verità (9.28). Il verso 29 ne trae la conclusione: questa forma è rara e temporanea, quindi chi è lucido deve sforzarsi subito per la liberazione, finché il corpo non muore, perché il godimento dei sensi c’è in ogni specie mentre solo l’uomo può coltivare la coscienza di Kṛṣṇa. A dirlo è il brāhmaṇa a re Yadu, e Kṛṣṇa lo ripete a Uddhava.'}
 ],

 context:[
  {v:true,t:'Dove si trova: Śrīmad-Bhāgavatam, Decimo Canto, capitolo 90, intitolato su Vedabase «Summary of Lord Kṛṣṇa’s Glories» (Sintesi delle glorie di Kṛṣṇa). Il verso 50 chiude il capitolo con il frutto dell’ascolto: chi ascolta, canta e medita con crescente sincerità sui temi di Mukunda raggiunge il regno del Signore, dove il potere della morte non ha presa (traduzione di Vedabase).'},
  {v:true,t:'Che cosa precede: nel verso 46 i Vṛṣṇi sono così assorbiti nella coscienza di Kṛṣṇa da dimenticare il proprio corpo mentre dormono, siedono, camminano, parlano, giocano e fanno il bagno. Nel verso 47 la gloria del Signore, disceso fra gli Yadu, supera quella del Gange; sia chi Lo odiava sia chi Lo amava ottiene una forma eterna simile alla Sua nel mondo spirituale; il Suo nome distrugge ogni inauspiciosità (traduzione di Vedabase).'},
  {v:true,t:'Che cosa segue: nel verso 49, per proteggere i princìpi del servizio devozionale a Sé, Kṛṣṇa, il migliore degli Yadu, accetta le forme di pastime glorificate nel Bhāgavatam; chi desidera servire i Suoi piedi di loto deve ascoltare le Sue attività in ciascuna di queste incarnazioni, e l’ascolto distrugge le reazioni del lavoro interessato (traduzione di Vedabase).'},
  {v:true,t:'Il verso è citato anche nell’Hari-bhakti-vilāsa 3.23 (capitolo 3, «Śaucīya-vilāsa», nel testo di wisdomlib), il primo di una serie di versi da recitare introdotta dal verso 3.22 e chiusa dal 3.27 («questa catuḥślokī»). Il testo coincide.'},
  {v:true,t:'Nello Śrī Ślokāmṛta-bindu (p. 24, sezione «Essential Ślokas») il verso ha il titolo «The nectar ocean of the Bhāgavatam in one śloka» (l’oceano di nettare del Bhāgavatam in un solo śloka).'},
  {v:false,t:'Il momento: siamo alla fine del Decimo Canto, nella sintesi finale delle glorie di Kṛṣṇa, dopo la Sua vita a Dvārakā. Il verso è una sorta di riassunto in un solo śloka: Kṛṣṇa è l’ultimo rifugio degli esseri, è noto come figlio di Devakī, elimina l’irreligione, distrugge le sventure degli esseri mobili e immobili e accresce i desideri amorosi delle fanciulle di Vraja. Questa lettura è mia, da verificare.'},

 context:[
  {v:true,t:'Dove si trova: Śrīmad-Bhāgavatam, Decimo Canto, capitolo 46, intitolato su Vedabase «Uddhava Visits Vṛndāvana» (Uddhava visita Vṛndāvana). Secondo il riassunto di Vedabase, Kṛṣṇa manda Uddhava a Vraja per consolare Nanda, Yaśodā e le gopī che soffrono per la separazione; Uddhava arriva al tramonto e passa la notte a parlare con Nanda.'},
  {v:true,t:'Chi parla all’inizio: il capitolo si apre con «śrī-śuka uvāca» (10.46.1): Śukadeva Gosvāmī presenta Uddhava, il più saggio consigliere dei Vṛṣṇi, caro amico di Kṛṣṇa e discepolo diretto di Bṛhaspati. Nei versi 2 e 3 Kṛṣṇa prende Uddhava per mano e gli dice: «Caro Uddhava, va’ a Vraja e dai gioia ai Nostri genitori; e solleva anche le gopī, che soffrono nella separazione da Me, dando loro il Mio messaggio». Nel verso 7 Uddhava accetta il messaggio, sale sul carro e parte per Nanda-gokula (traduzioni di Vedabase).'},
  {v:true,t:'Che cosa precede: nel verso 44, mentre il messaggero di Kṛṣṇa continuava a parlare con Nanda, la notte finì: le donne del villaggio dei pastori si alzarono dal letto, accesero le lampade, adorarono le divinità di casa e cominciarono a zangolare lo yogurt per ottenere il burro. Nel verso 45 le donne di Vraja, mentre tiravano le corde della zangola con le braccia ornate di braccialetti, brillavano dello splendore dei gioielli che riflettevano la luce delle lampade (traduzioni di Vedabase).'},
  {v:true,t:'Che cosa segue: nel verso 47, quando il sole fu sorto, gli abitanti di Vraja notarono davanti alla porta di Nanda Mahārāja il carro d’oro e si chiesero a chi appartenesse (traduzione di Vedabase).'},
  {v:true,t:'Il verso è citato anche nell’Hari-bhakti-vilāsa 3.26 (capitolo 3, «Śaucīya-vilāsa», nel testo di wisdomlib), con davanti «daśama-skandhe» (nel Decimo Canto). Fa parte della serie di versi da recitare che comincia al verso 3.22 e termina al 3.27 («questa catuḥślokī»). Il testo coincide.'},
  {v:false,t:'Il momento: è l’alba del giorno dopo l’arrivo di Uddhava. Nella casa di Nanda Uddhava e Nanda hanno parlato tutta la notte, mentre fuori le donne di Vraja iniziano la giornata zangolando e cantando le glorie di Kṛṣṇa: il verso 46 sta fra i versi 45 e 47, prima che qualcuno veda il carro. Questa collocazione è la mia lettura dei versi 44-47.'},
  {v:false,t:'Chi parla in questo verso: Vedabase non riporta una riga «uvāca» sul verso 46, che è narrazione (il verso 44 si rivolge a «O King»). Da ciò leggo che è Śukadeva Gosvāmī a raccontare a Parīkṣit; è una mia lettura, da verificare. Chi canta nel verso sono le donne di Vraja.'}
 ],

 context:[
  {v:true,t:'Dove si trova: Śrīmad-Bhāgavatam, Terzo Canto, capitolo 9, intitolato su Vedabase «Brahmā’s Prayers for Creative Energy» (Le preghiere di Brahmā per ottenere l’energia creativa). Il capitolo si apre con «brahmovāca» (3.9.1): «O mio Signore, oggi, dopo molti, molti anni di penitenza, ho conosciuto Te. Oh, quanto sono sfortunati gli esseri incarnati, che non riescono a conoscere la Tua Persona!» (traduzione di Vedabase).'},
  {v:true,t:'Che cosa precede il capitolo: il capitolo 8 si intitola su Vedabase «Manifestation of Brahmā from Garbhodakaśāyī Viṣṇu». Brahmā, nato dal loto, cerca per cento anni la propria origine; poi, dopo aver meditato, vede il Supremo dentro il proprio cuore e infine il Signore sdraiato su Śeṣa. Colmo di inclinazione a creare, comincia le sue preghiere (riassunto di Vedabase).'},
  {v:true,t:'Che cosa precede il verso: nel verso 24 Brahmā dice che sta ora manifestando le diverse energie del Signore nella creazione cosmica e prega di non essere distolto, nelle sue attività materiali, dalla vibrazione degli inni vedici (traduzione di Vedabase).'},
  {v:true,t:'Che cosa segue: il verso 26 si apre con «maitreya uvāca»: dopo aver osservato la fonte della propria nascita, cioè la Personalità di Dio, Brahmā pregò per la Sua misericordia fin dove la mente e le parole glielo permettevano; poi rimase in silenzio, come stanco per la penitenza, la conoscenza e la concentrazione mentale (traduzione di Vedabase).'},
  {v:false,t:'Il momento: il verso 25 è l’ultimo della preghiera di Brahmā, subito prima che si fermi. Dopo aver chiesto di non perdere gli inni vedici durante la creazione (verso 24), Brahmā chiede al Signore, l’antico Puruṣa, di rialzare l’intera creazione e di togliere con le Sue parole dolci il «nostro» abbattimento. Questa lettura è mia, da verificare.'},
  {v:false,t:'Chi parla: a pronunciare il verso è Brahmā (il capitolo si apre con «brahmovāca»), mentre la narrazione è di Maitreya (3.9.26). Che Maitreya racconti a Vidura è mia conoscenza generale, da verificare.'}

function fitVerse(){
  $$('.fitbox').forEach(function(box){
    var lines=$$('.fitline',box),max=Number(box.dataset.max),avail=box.clientWidth;
    if(!lines.length||!avail)return;
    var f=max,mn=(box.dataset.min?Number(box.dataset.min):10);
    lines.forEach(function(l){l.style.whiteSpace=''});
    for(var k=0;k<6;k++){
      lines.forEach(function(l){l.style.fontSize=f+'px'});
      var w=Math.max.apply(null,lines.map(function(l){return l.scrollWidth}));
      if(w<=avail||f<=mn)break;
      f=Math.max(mn,Math.floor(f*avail/w*100)/100-0.2);
    }
    if(mn>10&&f<=mn)lines.forEach(function(l){l.style.whiteSpace='normal'});
  });
}

/* ---------- confronto con correzione dei diacritici ---------- */
function strip(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'')}
function canon(s){return nf(s).toLowerCase().replace(/ṃ/g,'ṁ').replace(/[\s\-‐–—.,;:।॥0-9'’‘]/g,'')}
function align(u,c){
  var n=u.length,m=c.length,i,j,d=[];
  for(i=0;i<=n;i++){d.push(new Array(m+1).fill(0));d[i][0]=i}
  for(j=0;j<=m;j++)d[0][j]=j;
  for(i=1;i<=n;i++)for(j=1;j<=m;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(u[i-1]===c[j-1]?0:1));
  }
  var ops=[];i=n;j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(u[i-1]===c[j-1]?0:1)){
      ops.push(u[i-1]===c[j-1]?{t:'ok',u:u[i-1]}:{t:'sub',u:u[i-1],c:c[j-1]});i--;j--;
    }else if(i>0&&d[i][j]===d[i-1][j]+1){ops.push({t:'extra',u:u[i-1]});i--}
    else{ops.push({t:'miss',c:c[j-1]});j--}
  }
  return ops.reverse();
}
function compare(user,expected){
  var u=Array.from(canon(user)),c=Array.from(canon(expected));
  var ops=align(u,c),cnt={dia:0,let:0,extra:0,miss:0};
  ops.forEach(function(o){
    if(o.t==='sub'){o.k=(strip(o.u)===strip(o.c))?'dia':'let';cnt[o.k]++}
    else if(o.t==='extra')cnt.extra++;
    else if(o.t==='miss')cnt.miss++;
  });
  return {ok:u.join('')===c.join(''),ops:ops,cnt:cnt};
}
function renderDiff(ops){
  return ops.map(function(o){
    if(o.t==='ok')return esc(o.u);
    if(o.t==='sub')return '<span class="ch '+o.k+'">'+esc(o.u)+'<sup>'+esc(o.c)+'</sup></span>';
    if(o.t==='extra')return '<span class="ch extra">'+esc(o.u)+'</span>';
    return '<span class="ch miss">'+esc(o.c)+'</span>';
  }).join('');
}
function stCls(r,val){
  if(r.ok)return 'ok';
  if(!String(val).trim())return '';
  return (r.cnt.let||r.cnt.miss||r.cnt.extra)?'bad':'near';
}

    return '<button type="button" data-act="seg" data-name="'+name+'" data-val="'+o[0]+'" aria-pressed="'+(o[0]===String(cur))+'"'+(o[0]==='all'?'':' aria-label="Pāda '+o[1]+'"')+'>'+o[1]+'</button>';
  }).join('')+'</div>';
}
function allPads(){return PADAS.map(function(_,i){return i})}
function padsOf(st){return st.scope==='all'?allPads():[Number(st.scope)]}
function unitsOf(pi){var u=[];PADAS[pi].tok.forEach(function(t,i){if(t.w)u.push(i)});return u}
function fullText(pads,noDev){
  return pads.map(function(pi){return '<div class="pada"><span class="pn">'+(pi+1)+'</span><div><div class="iast">'+esc(PADAS[pi].iast)+'</div>'+(noDev?'':devLine(pi))+'</div></div>'}).join('');
}
function eyeSm(act,on){return '<button type="button" class="eyesm" data-act="'+act+'" aria-pressed="'+!!on+'" aria-label="'+(on?'Nascondi il testo':'Mostra il testo')+'">'+(on?EYE.shut:EYE.open)+'</button>'}
function showLabel(on){return on?'Nascondi il testo':'Mostra il testo'}
/* traduzione sotto ogni pāda (significati del parola per parola) e traduzione intera in fondo; si accende e si spegne senza ridisegnare, così non si perde ciò che hai scritto */
var trShow=false;
var TRI='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10H10l-4.5 4v-4H4z"></path><path d="M8 9.5h8M8 12.5h5"></path></svg>';
function trBtn(){return '<button type="button" class="eyesm trbtn" data-act="tr-show" aria-pressed="'+trShow+'" aria-label="'+(trShow?'Nascondi la traduzione':'Mostra la traduzione')+'">'+TRI+'</button>'}
function trGloss(pi){var g=glossOf(pi);return g?'<div class="gloss trl"'+(trShow?'':' hidden')+'>'+esc(g)+'</div>':''}
function trFull(){var d=DATA[cur];return d&&d.translation?'<div class="card trl"'+(trShow?'':' hidden')+'><p class="eyebrow">Traduzione</p><p class="trad">'+esc(d.translation)+'</p></div>':''}
function trToggle(){
  trShow=!trShow;
  $$('.trl').forEach(function(el){el.hidden=!trShow});
  $$('.trbtn').forEach(function(b){b.setAttribute('aria-pressed',String(trShow));b.setAttribute('aria-label',trShow?'Nascondi la traduzione':'Mostra la traduzione')});

/* ---------- MEMORIZZA ---------- */
var mem={scope:'all',level:1,hidden:new Set(),hid0:new Set(),show:false,gloss:true};
function memReset(){
  mem.hidden=new Set();mem.show=false;
  padsOf(mem).forEach(function(pi){
    var units=unitsOf(pi),hide;
    if(mem.level===3)hide=units;
    else if(mem.level===2)hide=units.slice(1);
    else hide=shuffle(units.slice()).slice(0,Math.max(1,Math.round(units.length/2)));
    hide.forEach(function(ui){mem.hidden.add(pi+':'+ui)});
  });
  mem.hid0=new Set(mem.hidden);saveStudio();
}
function renderMem(){
  var rows=padsOf(mem).map(function(pi){
    var html=PADAS[pi].tok.map(function(t,i){
      if(!t.w)return '<span class="sep">'+esc(t.t)+'</span>';
      var k=pi+':'+i;
      if(!mem.show&&mem.hid0.has(k)){
        if(mem.hidden.has(k))return '<button type="button" class="blank" data-act="mem-reveal" data-k="'+k+'" style="width:'+Math.max(2.4,t.t.length)+'ch" aria-label="Parola nascosta, tocca per rivelare"></button>';
        return '<button type="button" class="blank rev" data-act="mem-hide" data-k="'+k+'" aria-label="Tocca per nascondere di nuovo">'+esc(t.t)+'</button>';
      }
      return esc(t.t);
    }).join('');
    return '<div class="mrow"><div class="iast fitline">'+html+'</div>'+trGloss(pi)+'</div>';
  }).join('');
  $('#p-memorizza').innerHTML=
   '<div class="card ctl">'+scopeSeg('mem-scope',mem.scope)+'<div class="diffrow">'+diffSeg('mem-level',mem.level)+trBtn()+eyeSm('mem-show',mem.show)+'</div></div>'+
   '<div class="card"><div class="fitbox" data-max="21">'+rows+'</div></div>'+trFull();
  fitVerse();
}

/* ---------- SCRIVI: parole mancanti (facile, medio) o righe intere (difficile) ---------- */
var wr={scope:'all',level:1,blanks:{},show:false,counted:false,hinted:false};
function wrReset(){
  wr.blanks={};wr.show=false;wr.counted=false;wr.hinted=false;saveStudio();
  padsOf(wr).forEach(function(pi){
    var u=unitsOf(pi);
    wr.blanks[pi]=shuffle(u.slice()).slice(0,wr.level===1?1:Math.ceil(u.length/2));
  });
}
function perfLine(){var n=perfOf().verse;return 'Verso intero scritto a memoria: '+n+(n===1?' volta':' volte')}
var FLD='data-kb="1" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';
function renderWr(){
  var num=(wr.scope==='all'&&wr.level===3);   /* i numeri delle righe solo con «Tutto» e «Difficile» */
  var lines=padsOf(wr).map(function(pi){
    if(wr.level===3){
      var inp='<input class="fld wide" id="wr-'+pi+'" '+FLD+' aria-label="Pāda '+(pi+1)+'">';
      return num?'<div class="pada" style="align-items:center"><span class="pn">'+(pi+1)+'</span><div>'+inp+trGloss(pi)+'</div></div>':'<div class="mrow">'+inp+trGloss(pi)+'</div>';
    }
    return '<div class="mrow"><div class="cloze fitline">'+PADAS[pi].tok.map(function(t,i){
      if(!t.w)return '<span class="sep">'+esc(t.t)+'</span>';
      if(wr.blanks[pi].indexOf(i)>=0)return '<input class="fld" id="wr-'+pi+'-'+i+'" '+FLD+' aria-label="Parola mancante" style="width:'+(t.t.length+1)+'ch">';
      return esc(t.t);
    }).join('')+'</div>'+trGloss(pi)+'</div>';
  }).join('');
  if(wr.level<3)lines='<div class="fitbox" data-max="21">'+lines+'</div>';
  $('#p-scrivi').innerHTML=
   '<div class="card ctl">'+scopeSeg('wr-scope',wr.scope)+'<div class="diffrow">'+diffSeg('wr-level',wr.level)+trBtn()+'</div>'+
   '</div>'+
   '<div class="card">'+lines+kbHtml()+wrBtns()+'<div id="wr-fb" aria-live="polite"></div></div>'+trFull()+
   '<p class="hint" id="wr-perf">'+perfLine()+'</p>';
  updateDock();fitVerse();
}
function wrCheck(){
  var items=[];
  padsOf(wr).forEach(function(pi){
    if(wr.level===3)items.push({id:'wr-'+pi,exp:PADAS[pi].iast,name:'Pāda '+(pi+1),tell:false});
    else wr.blanks[pi].slice().sort(function(a,b){return a-b}).forEach(function(i){items.push({id:'wr-'+pi+'-'+i,exp:PADAS[pi].tok[i].t,name:'Pāda '+(pi+1),tell:true})});
  });
  if(wr.show){$('#wr-fb').innerHTML='<p class="hint">Nascondi il testo per controllare ciò che hai scritto.</p>';return}
  var html='',good=0,empties=[];
  items.forEach(function(it){
    var inp=$('#'+it.id),val=inp.value,r=compare(val,it.exp);
    setSt(inp,r);
    var fix=it.tell?'<div class="fbs">Corretto: <b>'+esc(it.exp)+'</b></div>':'';
    if(r.ok)good++;
    else if(!val.trim()){
      if(it.tell)html+='<div class="fbrow bad">'+it.name+': vuoto.'+fix+'</div>';else empties.push(it.name.replace('Pāda ',''));
    }
    else html+='<div class="fbrow bad"><div class="fbs">'+it.name+'</div><div class="diff">'+renderDiff(r.ops)+'</div><div class="fbs">'+summary(r.cnt)+'</div>'+fix+'</div>';
  });
  if(empties.length)html='<div class="fbrow bad">'+(empties.length===1?'Pāda ':'Pāda ')+empties.join(', ')+': vuot'+(empties.length===1?'o':'i')+'.</div>'+html;
  var all=good===items.length;
  if(all&&wr.level===3&&wr.scope==='all'&&!wr.counted&&!wr.show&&!wr.hinted){
    wr.counted=true;perfOf().verse++;put(PFKEY,perf);var pe=$('#wr-perf');if(pe)pe.textContent=perfLine();
  }
  $('#wr-fb').innerHTML=(all?'<p class="good" style="margin:12px 0 0">Tutto giusto.</p>':'<p style="margin:12px 0 0"><b>'+good+' su '+items.length+'</b> giuste.</p>')+html+(all?'':LEGEND);
  try{$('#wr-fb').scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
}
/* Scrivi: «Mostra il testo» scrive il testo corretto dentro le caselle (e lo toglie); «Riprova» le svuota e si riscrive lo stesso testo */
function wrBtns(){return '<div class="abtns four"><button type="button" class="btn primary" data-act="wr-check">Controlla</button><button type="button" class="btn" data-act="wr-hint">Aiuto</button>'+eyeSm('wr-show',wr.show).replace('class="eyesm"','class="eyesm" id="wr-show"')+'<button type="button" class="btn" data-act="wr-clear">Riprova</button></div>'}
function wrInputs(){return $$('#p-scrivi input.fld')}
/* «Aiuto»: aggiunge una lettera giusta alla casella in uso (o alla prima non ancora giusta) */
function wrHint(){
  if(wr.show)return;
  var el=(lastField&&lastField.id&&lastField.id.indexOf('wr-')===0&&document.body.contains(lastField))?lastField:null;
  if(!el)el=wrInputs().filter(function(x){return !compare(x.value,wrAnswer(x)).ok})[0];
  if(!el)return;
  var ans=nf(wrAnswer(el)),v=nf(el.value),l=0;
  while(l<v.length&&l<ans.length&&v[l]===ans[l])l++;
  el.value=ans.slice(0,Math.min(ans.length,l+1));
  el.classList.remove('ok','bad','near');wr.hinted=true;
  el.focus({preventScroll:true});
}
function wrAnswer(inp){
  var m=inp.id.match(/^wr-(\d+)(?:-(\d+))?$/),pi=Number(m[1]);
  return m[2]===undefined?PADAS[pi].iast:PADAS[pi].tok[Number(m[2])].t;
}
function wrToggle(){
  wr.show=!wr.show;
  wrInputs().forEach(function(inp){
    if(wr.show){inp.dataset.mine=inp.value;inp.value=wrAnswer(inp);inp.readOnly=true;inp.classList.remove('ok','bad','near');inp.classList.add('shown')}
    else{inp.value=inp.dataset.mine||'';inp.readOnly=false;inp.classList.remove('shown')}
  });
  var b=$('#wr-show');b.innerHTML=wr.show?EYE.shut:EYE.open;b.setAttribute('aria-pressed',String(wr.show));b.setAttribute('aria-label',wr.show?'Nascondi il testo':'Mostra il testo');
  if(wr.show)$('#wr-fb').innerHTML='';
}
function wrRetry(){
  wr.show=false;wr.counted=false;wr.hinted=false;
  wrInputs().forEach(function(inp){inp.value='';inp.dataset.mine='';inp.readOnly=false;inp.classList.remove('ok','bad','near','shown')});
  $('#wr-fb').innerHTML='';
  var b=$('#wr-show');b.innerHTML=EYE.open;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','Mostra il testo');
}

/* ---------- SANDHI: esercizio sui sandhi ---------- */
var sd={q:null,pick:null,order:[],oi:0,opts:[]};
function sdNext(){
  if(sd.oi>=sd.order.length){sd.order=shuffle(SANDHI.map(function(_,i){return i}));sd.oi=0}
  sd.q=sd.order[sd.oi++];sd.pick=null;
  var right=SANDHI[sd.q].sut[0],pool=[];
  SANDHI.forEach(function(s2){s2.sut.forEach(function(n){if(n!==right&&pool.indexOf(n)<0)pool.push(n)})});
  sd.opts=[right].concat(shuffle(pool).slice(0,3)).sort(function(a,b){return a-b});
}
function renderSdEx(){
  if(!SANDHI.length){$('#p-grammatica').innerHTML='';return}
  if(sd.q===null)sdNext();
  var x=SANDHI[sd.q],opts=sd.opts;
  $('#p-grammatica').innerHTML='<div class="card">'+
   '<p class="eq" style="margin:0 0 6px">'+esc(x.a)+' + '+esc(x.b)+' → ?</p>'+
   '<label class="lbl" for="sd-in">Risultato</label>'+
   '<input class="fld wide" id="sd-in" data-kb="1" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">'+
   kbHtml()+
   '<p class="lbl" style="margin-top:12px">Quale sūtra?</p>'+
   '<div class="choices" id="sd-ch">'+opts.map(function(n){return '<button type="button" data-act="sd-pick" data-n="'+n+'" aria-pressed="false"><span class="cn">'+n+'</span><span class="ct">'+esc(SUTRA[n].txt)+'</span></button>'}).join('')+'</div>'+
   '<div class="abtns three"><button type="button" class="btn primary" data-act="sd-check">Controlla</button><button type="button" class="btn" data-act="sd-retry">Riprova</button><button type="button" class="btn" data-act="sd-next">Prossima</button></div>'+
   '<div id="sd-fb" aria-live="polite"></div></div>';
}
function sdCheck(){
  var x=SANDHI[sd.q],inp=$('#sd-in'),val=inp.value,r=compare(val,x.r),html='';
  setSt(inp,r);
  if(r.ok)html+='<div class="fbrow ok">✓ Risultato giusto: <i>'+esc(x.r)+'</i></div>';
  else if(!val.trim())html+='<div class="fbrow bad">Risultato vuoto. Corretto: <i>'+esc(x.r)+'</i></div>';
  else html+='<div class="fbrow bad"><div class="diff">'+renderDiff(r.ops)+'</div><div class="fbs">'+summary(r.cnt)+'</div><div class="fbs">Corretto: <i>'+esc(x.r)+'</i></div></div>';
  var right=x.sut[0];
  $$('#sd-ch button').forEach(function(b){
    var n=Number(b.dataset.n);
    b.classList.remove('ok','bad');
    if(n===right)b.classList.add('ok');
    else if(sd.pick===n)b.classList.add('bad');
  });
  if(sd.pick===null)html+='<div class="fbrow bad">Non hai scelto il sūtra. Quello giusto è il <b>'+right+'</b>.</div>';
  else if(sd.pick===right)html+='<div class="fbrow ok">✓ Sūtra '+right+' giusto.</div>';
  else html+='<div class="fbrow bad">Sūtra '+sd.pick+': non è questo. Quello giusto è il <b>'+right+'</b>.</div>';
  html+=sutH(right);
  if(x.note)html+='<p class="hint" style="margin-top:8px">'+esc(x.note)+'</p>';
  $('#sd-fb').innerHTML=html+(r.ok?'':LEGEND);
  try{$('#sd-fb').scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
}

/* ---------- QUIZ (in più rispetto al Dāmodarāṣṭakam) ---------- */
var qz=null;
function qOpts(correct,pool,keep){
  var seen={},o=[correct];
  seen[canon(correct)]=1;
  (keep?pool:shuffle(pool.slice())).forEach(function(t){var c=canon(t);if(o.length<4&&!seen[c]){seen[c]=1;o.push(t)}});
  return shuffle(o);
}
function buildQuiz(d){
  var W=d.words||[],P=d.padas,qs=[],all=[],allP=[],own={};
  DATA.forEach(function(x){(x.words||[]).forEach(function(w){all.push(w)});x.padas.forEach(function(p){allP.push(p.iast)})});
  P.forEach(function(p){own[canon(p.iast)]=1});
  W.forEach(function(w){
    var o,toIt=Math.random()<0.5;
    if(toIt){
      o=qOpts(w.mean,all.map(function(x){return x.mean}));
      qs.push({q:'Che cosa significa <i>'+esc(w.k)+'</i>?',o:o,c:o.indexOf(w.mean)});
    }else{
      o=qOpts(w.k,all.filter(function(x){return canon(x.mean)!==canon(w.mean)}).map(function(x){return x.k}));
      qs.push({q:'Quale parola significa «'+esc(w.mean)+'»?',o:o,c:o.indexOf(w.k)});
    }
  });
  for(var i=0;i<P.length-1;i++){
    var near=P.filter(function(_,j){return j!==i&&j!==i+1}).map(function(p){return p.iast});
    var far=shuffle(allP.filter(function(t){return !own[canon(t)]}));
    var okp=P[i+1].iast,o2=qOpts(okp,shuffle(near).concat(far),true);
    qs.push({q:'Quale pāda viene dopo <i>'+esc(P[i].iast)+'</i>?',o:o2,c:o2.indexOf(okp)});
  }
  return shuffle(qs.filter(function(q){return q.o.length>=2})).slice(0,8);
}
function renderQz(){
  var d=DATA[cur],html;
  if(!qz)qz={qs:buildQuiz(d),i:0,score:0,pick:null,done:false,res:[]};
  if(!qz.qs.length){
    html='<div class="card"><p class="hint" style="color:var(--ink)">Per questo verso non ci sono ancora abbastanza dati per un quiz.</p></div>';
  }else if(qz.done){
    html='<div class="card" style="text-align:center"><h2>Quiz finito</h2><p class="trad" style="text-align:center">Risposte giuste: '+qz.score+' su '+qz.qs.length+'.</p><div class="row" style="justify-content:center;margin-top:12px"><button type="button" class="btn primary" data-act="qz-restart">Nuovo quiz</button></div></div>';
  }else{
    var q=qz.qs[qz.i],L='ABCD';
    html='<div class="qdots" aria-label="Domanda '+(qz.i+1)+' di '+qz.qs.length+'">'+qz.qs.map(function(_,k){return '<i class="'+(qz.res[k]===true?'ok':qz.res[k]===false?'bad':(k===qz.i?'cur':''))+'"></i>'}).join('')+'</div>'+
     '<div class="card"><p class="eyebrow">Domanda</p><p class="trad" style="font-size:17.5px;padding-inline:0">'+q.q+'</p>'+
     '<div class="choices" role="group">'+q.o.map(function(t,n){
       var cls='';
       if(qz.pick!==null){if(n===q.c)cls='ok';else if(n===qz.pick)cls='bad'}
       return '<button type="button" class="'+cls+'" data-act="qz-pick" data-n="'+n+'"><span class="cn">'+L.charAt(n)+'</span><span class="ct">'+esc(t)+'</span></button>';
     }).join('')+'</div>'+
     (qz.pick!==null?'<p class="fbs" style="margin-top:10px">'+(qz.pick===q.c?'<span class="good">Giusto.</span>':'Non è questa: la risposta giusta è evidenziata in verde.')+'</p><div class="row" style="margin-top:10px"><button type="button" class="btn primary" data-act="qz-next">'+(qz.i+1>=qz.qs.length?'Vedi il risultato':'Avanti')+'</button></div>':'')+
     '</div><p class="hint">I significati vengono dal parola per parola del verso, che in parte è analisi mia da verificare.</p>';
  }
  $('#p-quiz').innerHTML=html;
}

function dockHtml(kind){
  var keys='<div class="kbrow" role="group" aria-label="Diacritici">'+KEYS.map(function(k){return '<button type="button" class="key" data-act="key" data-ch="'+k+'" aria-label="inserisci '+k+'">'+k+'</button>'}).join('')+'</div>';
  if(kind==='scrivi')return keys+'<div class="dbtns four"><button type="button" class="btn primary" data-act="wr-check">Controlla</button><button type="button" class="btn" data-act="wr-hint">Aiuto</button><button type="button" class="btn" id="wr-show" data-act="wr-show" aria-pressed="'+wr.show+'">'+(wr.show?'Nascondi':'Mostra')+'</button><button type="button" class="btn" data-act="wr-clear">Riprova</button></div>';
  return keys+'<div class="dbtns three"><button type="button" class="btn primary" data-act="sd-check">Controlla</button><button type="button" class="btn" data-act="sd-retry">Riprova</button><button type="button" class="btn" data-act="sd-next">Prossima</button></div>';
}
function placeDock(){
  var d=$('#dock');if(!d||d.hidden)return;
  var vv=window.visualViewport,kbo=vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):0;
  d.style.bottom=kbo>120?(kbo+6)+'px':'';
}
function updateDock(){var d=$('#dock');if(d)d.hidden=true;document.body.classList.remove('hasdock')}
if(window.visualViewport){window.visualViewport.addEventListener('resize',placeDock);window.visualViewport.addEventListener('scroll',placeDock)}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target.matches||!e.target.matches('input.fld'))return;
  e.preventDefault();
  var el=e.target;
  if(el.id==='sd-in'){sdCheck();el.blur();return}
  if(el.id.indexOf('wr-')===0&&!wr.show){
    setSt(el,compare(el.value,wrAnswer(el)));
    var all=wrInputs(),k=all.indexOf(el);
    if(k<all.length-1)all[k+1].focus();else{wrCheck();el.blur()}
  }
});
document.addEventListener('focusin',function(e){
  if(e.target.matches&&e.target.matches('input.fld'))setTimeout(function(){try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},320);
});

/* ---------- tastiera dei diacritici e gesti ---------- */
function insertChar(ch){
  var el=lastField;
  if(!el||!document.body.contains(el)||el.offsetParent===null)return;
  el.focus({preventScroll:true});
  var s=(el.selectionStart==null)?el.value.length:el.selectionStart,e=(el.selectionEnd==null)?s:el.selectionEnd;
  el.value=el.value.slice(0,s)+ch+el.value.slice(e);
  var p=s+ch.length;try{el.setSelectionRange(p,p)}catch(x){}
  el.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('animationend',function(e){if(e.target.parentNode&&e.target.parentNode.classList&&e.animationName==='rise')e.target.parentNode.classList.remove('enter')});
/* scorrendo il dito a destra o a sinistra si cambia scheda.
   Sul riquadro del verso: Traduzione, Parola per parola, Sandhi, Metrica. Sulla barra in basso: Verso, Studio, Ripasso.
   Sulla fila degli esercizi: Memorizza, Scrivi, Parole, Sandhi, Quiz. */
var swipe=null,MODES=['trad','wbw','gram','metr'];
document.addEventListener('touchstart',function(e){
  swipe=null;
  if(cur<0||!e.target.closest)return;
  var zone=e.target.closest('nav')?'nav':(e.target.closest('#subnav')?'sub':(main==='verso'&&e.target.closest('.vcard')?'card':null));
  if(zone){var t=e.touches[0];swipe={x:t.clientX,y:t.clientY,zone:zone}}
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!swipe)return;
  var t=e.changedTouches[0],dx=t.clientX-swipe.x,dy=t.clientY-swipe.y,zone=swipe.zone;swipe=null;
  if(Math.abs(dx)<45||Math.abs(dx)<1.5*Math.abs(dy))return;
  function step(c,len){return dx<0?Math.min(len-1,c+1):Math.max(0,c<0?0:c-1)}
  var c=-1,next;
  if(zone==='nav'){
    MAINS.forEach(function(m,i){if(m[0]===main)c=i});next=step(c,MAINS.length);
    if(next!==c){main=MAINS[next][0];curSub=null;show()}
  }else if(zone==='sub'){
    SUBS.forEach(function(m,i){if(m[0]===curSub)c=i});next=step(c,SUBS.length);
    if(next!==c){curSub=SUBS[next][0];show()}
  }else{
    var MD=modesOf(DATA[cur]);MD.forEach(function(m,i){if(m===prefs.mode)c=i});next=step(c,MD.length);
    if(next===c)return;
    prefs.mode=MD[next];sel=null;renderVerso();
    var cd=$('#p-verso .vcard');if(cd)cd.classList.add(dx<0?'in-l':'in-r');
  }
},{passive:true});
/* scorrendo il dito verso destra (da sinistra a destra) su un punto libero della pagina del verso (fuori da riquadro, barre e campi di scrittura) si torna alla home */
var back=null;
function scrollableX(el){for(;el&&el!==document.body;el=el.parentNode){if(el.nodeType===1&&el.scrollWidth>el.clientWidth+2){var o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return true}}return false}
document.addEventListener('touchstart',function(e){
  back=null;
  var vv=$('#verseview');if(cur<0||!vv||vv.hidden||!e.target.closest||e.touches.length!==1)return;
  if(e.target.closest('nav,#subnav,.vcard,input,textarea,select,button,a,.key,#dock')||scrollableX(e.target))return;
  var t=e.touches[0];back={x:t.clientX,y:t.clientY}
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!back)return;
  var t=e.changedTouches[0],dx=t.clientX-back.x,dy=t.clientY-back.y;back=null;
  if(dx>60&&Math.abs(dx)>=2*Math.abs(dy))goHome();
},{passive:true});
document.addEventListener('focusin',function(e){if(e.target.matches&&e.target.matches('[data-kb]'))lastField=e.target});
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('.key'))e.preventDefault()});
document.addEventListener('input',function(e){
  if(e.target.id&&e.target.id.indexOf('wr-')===0)wr.counted=false;
});

function bindVerse(i){var d=DATA[i];restoreStudio(i);PADAS=d.padas;WORDS=d.words||[];SURF=d.surf||[];SUTRA=d.sutra||{};SANDHI=d.sandhi||[];SEG=d.seg||[]}
/* ---------- eventi ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b)return;
  var act=b.dataset.act;
  switch(act){
   case 'open':openVerse(Number(b.dataset.i));break;
   case 'home':goHome();break;
   case 'review':goReview();break;
   case 'theme':prefs.theme={auto:'light',light:'dark',dark:'auto'}[prefs.theme];saveAll();applyTheme();break;
   case 'pref-dev':prefs.dev=!prefs.dev;applyPrefs();renderVerso();renderMem();break;
   case 'pref-trad':case 'pref-wbw':case 'pref-gram':case 'pref-metr':{
     var k=act.slice(5);prefs.mode=prefs.mode===k?'trad':k;sel=null;renderVerso();break;}
   case 'learned':{var d=DATA[cur];stars[d.id]=!stars[d.id];if(!stars[d.id])delete stars[d.id];saveAll();applyPrefs();break;}
   case 'word':sel=[Number(b.dataset.p),Number(b.dataset.j)];renderVerso();break;
   case 'sg':{
     var card=$('#sd-card-'+b.dataset.s);
     if(card){
       $('#sd-b-'+b.dataset.s).hidden=false;card.querySelector('.sh').setAttribute('aria-expanded','true');
       card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash');
       try{card.scrollIntoView({behavior:'smooth',block:'center'})}catch(x){card.scrollIntoView()}
     }
     break;}
   case 'sd-tog':{var el=$('#'+b.dataset.t);el.hidden=!el.hidden;b.setAttribute('aria-expanded',String(!el.hidden));break;}
   case 'seg':{
     var n=b.dataset.name,v=b.dataset.val;
     if(n==='mem-scope'){mem.scope=v;memReset();renderMem()}
     else if(n==='mem-level'){mem.level=Number(v);memReset();renderMem()}
     else if(n==='wr-scope'){wr.scope=v;wrReset();renderWr()}
     else if(n==='wr-level'){wr.level=Number(v);wrReset();renderWr()}
     else if(n==='pw-mode'){pw.mode=v;pw.flip=false;renderPw()}
     else if(n==='rv-mode'){rv.mode=v;rvReset();renderRv()}
     break;}
   case 'main':main=b.dataset.id;curSub=null;show();break;
   case 'sub':curSub=b.dataset.id;lastSub=curSub;saveStudio();show();break;
   case 'key':insertChar(b.dataset.ch);break;
   case 'mem-reveal':mem.hidden.delete(b.dataset.k);renderMem();break;
   case 'mem-hide':mem.hidden.add(b.dataset.k);renderMem();break;
   case 'wr-hint':wrHint();break;
   case 'mem-show':mem.show=!mem.show;renderMem();break;
   case 'tr-show':trToggle();break;
   case 'wr-check':wrCheck();break;
   case 'wr-show':wrToggle();break;
   case 'wr-clear':wrRetry();break;
   case 'sd-pick':
     sd.pick=Number(b.dataset.n);
     $$('#sd-ch button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));x.classList.remove('ok','bad')});
     break;
   case 'sd-check':sdCheck();break;
   case 'sd-retry':sd.pick=null;renderSdEx();break;
   case 'sd-next':sdNext();renderSdEx();break;
   case 'pw-flip':pw.flip=!pw.flip;renderPw();break;
   case 'pw-next':pw.i=(pw.i+1)%WORDS.length;pw.flip=false;renderPw();break;
   case 'pw-shuffle':shuffle(pw.order);pw.i=0;pw.flip=false;renderPw();break;
   case 'pw-prev':pw.i=(pw.i-1+WORDS.length)%WORDS.length;pw.flip=false;renderPw();break;
   case 'rp-show':rp.shown=!rp.shown;renderRp();break;
   case 'qz-pick':{if(!qz||qz.pick!==null)break;qz.pick=Number(b.dataset.n);qz.res[qz.i]=(qz.pick===qz.qs[qz.i].c);if(qz.res[qz.i])qz.score++;renderQz();break;}
   case 'qz-next':qz.i++;qz.pick=null;if(qz.i>=qz.qs.length)qz.done=true;renderQz();break;
   case 'qz-restart':qz=null;renderQz();break;
   case 'rv-flip':rv.flip=!rv.flip;renderRv();break;
   case 'rv-next':rv.i=(rv.i+1)%rv.order.length;rv.flip=false;renderRv();break;
   case 'rv-prev':rv.i=(rv.i-1+rv.order.length)%rv.order.length;rv.flip=false;renderRv();break;
   case 'rv-shuffle':shuffle(rv.order);rv.i=0;rv.flip=false;renderRv();break;
  }
});

/* ---------- avvio ---------- */
applyTheme();goHome();
})();
</script>
